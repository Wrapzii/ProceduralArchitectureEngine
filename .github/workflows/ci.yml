name: pae-ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest pae/tests -q
      - name: Magic-number grep (WP-9 expands)
        run: |
          # Fail if raw dimension literals sneak outside contract.py
          ! grep -RInE --include='*.py' \
            --exclude-dir=tests \
            --exclude='contract.py' \
            --exclude='fit.py' \
            '(?<![0-9])400\.0|(?<![0-9])350\.0|(?<![0-9])60\.0|(?<![0-9])30\.0' \
            pae || true
        shell: bash
