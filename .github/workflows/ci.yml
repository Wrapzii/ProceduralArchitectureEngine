name: pae-ci

on:
  push:
  pull_request:

concurrency:
  group: pae-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (editable + dev)
        run: pip install -e ".[dev]"

      - name: Unit / property / golden tests
        run: python -m pytest pae/tests -q --tb=short

      - name: Magic-number grep (contract dimensions)
        run: python tools/magic_number_grep.py

  # Optional: keep a clean signal when Blender becomes available in CI later
  # blender-golden:
  #   if: false
  #   runs-on: ubuntu-latest
  #   steps: ...
